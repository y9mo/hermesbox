---
omp_builder_user: omp-builder
omp_builder_home: /var/lib/omp-builder
omp_builder_root: /opt/omp-builder
omp_builder_config_dir: /etc/omp-builder
omp_builder_owner_public_key_file: "{{ lookup('env', 'HOME') }}/.ssh/hetznercloud.pub"
omp_builder_github_token_passwordstore_entry: y9mo/github/pat/hermesbox
omp_builder_runinfra_key_passwordstore_entry: y9mo/runinfra/apikey
omp_builder_deepseek_key_passwordstore_entry: y9mo/deepseek/hermes
omp_builder_mistral_key_passwordstore_entry: y9mo/mistral/hermes
omp_builder_github_token: >-
  {{ lookup('community.general.passwordstore',
            omp_builder_github_token_passwordstore_entry, missing='error') }}
omp_builder_runinfra_key: >-
  {{ lookup('community.general.passwordstore',
            omp_builder_runinfra_key_passwordstore_entry, missing='error') }}
omp_builder_deepseek_key: >-
  {{ lookup('community.general.passwordstore',
            omp_builder_deepseek_key_passwordstore_entry, missing='error') }}
omp_builder_mistral_key: >-
  {{ lookup('community.general.passwordstore',
            omp_builder_mistral_key_passwordstore_entry, missing='error') }}
omp_builder_coordinator_model: openai-codex/gpt-6-luna:low
omp_builder_architect_model: openai-codex/gpt-6-sol:medium
omp_builder_reviewer_model: openai-codex/gpt-6-sol:medium
omp_builder_designer_model: openai-codex/gpt-6-astra:low
omp_builder_implementer_model: openai-codex/gpt-6-luna:low
omp_builder_acceptance_model: deepseek/deepseek-flash:max
omp_builder_runinfra_implementer_model: runinfra/zai-org/GLM-5.3-Flash:max
omp_builder_runinfra_acceptance_model: runinfra/zai-org/GLM-5.3-Flash:max
omp_builder_mistral_implementer_model: mistral/zai-glm-5-3:medium
# Upgrade version and checksums together, then deliberately restart running sessions.
omp_builder_version: 18.3.2
